
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vincent Deriv Analyzer</title>
<style>
body{background:#101827;color:white;font-family:Arial;padding:15px}
h1{text-align:center;color:#35d5a0}
h2{color:#35d5a0}
.status,.market{background:#1d2b40;padding:14px;margin:12px 0;border-radius:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#293b54;padding:10px;border-radius:8px}
.big{font-size:25px;color:#35d5a0;font-weight:bold}
.digits{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.digit{background:#293b54;text-align:center;padding:8px 2px;border-radius:7px}
.bar{height:5px;background:#35d5a0;margin-top:5px}
button{background:#35d5a0;padding:12px;border:0;border-radius:8px;font-weight:bold}
.note{font-size:12px;color:#bdc9d8;line-height:1.5}
</style>
</head>
<body>
<h1>Vincent Deriv Analyzer</h1>
<div class="status" id="status">Connecting...</div>
<button onclick="reconnect()">Reconnect</button>
<div id="markets"></div>
<p class="note">The leading digit is based on the last 100 ticks. Historical frequency does not guarantee the next digit. This is an analysis tool, not a guaranteed trading signal.</p>

<script>
const SYMBOLS=[
{symbol:"R_10",name:"Volatility 10"},
{symbol:"R_25",name:"Volatility 25"},
{symbol:"R_50",name:"Volatility 50"},
{symbol:"R_75",name:"Volatility 75"},
{symbol:"R_100",name:"Volatility 100"}
];

let socket;
let data={};

SYMBOLS.forEach(m=>{
data[m.symbol]={digits:[],price:"--",last:"--",counts:Array(10).fill(0)};
});

function setup(){
const container=document.getElementById("markets");
SYMBOLS.forEach(m=>{
container.innerHTML+=`
<div class="market">
<h2>${m.name}</h2>
<div class="stats">
<div class="stat">Latest price<br><b id="price_${m.symbol}">--</b></div>
<div class="stat">Latest digit<br><span class="big" id="last_${m.symbol}">--</span></div>
<div class="stat">Ticks scanned<br><b id="ticks_${m.symbol}">0</b></div>
<div class="stat">Most frequent digit<br><span class="big" id="top_${m.symbol}">--</span></div>
</div>
<h3>Digit frequency (0–9)</h3>
<div class="digits" id="digits_${m.symbol}"></div>
</div>`;
});
}

function reconnect(){
if(socket){
socket.onclose=null;
socket.close();
}
connect();
}

function connect(){
document.getElementById("status").textContent="Connecting...";
socket=new WebSocket("wss://api.derivws.com/trading/v1/options/ws/public");

socket.onopen=()=>{
document.getElementById("status").textContent="Connected — scanning five indices";
SYMBOLS.forEach(m=>{
socket.send(JSON.stringify({
ticks:m.symbol,
subscribe:1
}));
});
};

socket.onmessage=(event)=>{
const msg=JSON.parse(event.data);
if(msg.error){
document.getElementById("status").textContent="Error: "+msg.error.message;
return;
}
if(msg.msg_type==="tick"&&msg.tick){
processTick(msg.tick);
}
};

socket.onerror=()=>{
document.getElementById("status").textContent="Connection error. Tap Reconnect.";
};

socket.onclose=()=>{
document.getElementById("status").textContent="Disconnected. Tap Reconnect.";
};
}

function processTick(tick){
const symbol=tick.symbol;
if(!data[symbol])return;

const item=data[symbol];
const price=Number(tick.quote);
if(!Number.isFinite(price))return;

const decimals=Number(tick.pip_size);
const formatted=price.toFixed(Number.isFinite(decimals)?decimals:2);
const digit=Number(formatted.replace(/\D/g,"").slice(-1));

item.price=formatted;
item.last=digit;
item.digits.push(digit);

;

item.counts=Array(10).fill(0);
item.digits.forEach(d=>item.counts[d]++);

updateMarket(symbol);
}

function updateMarket(symbol){
const item=data[symbol];
const total=item.digits.length;
const max=Math.max(...item.counts);
const leaders=item.counts
.map((count,digit)=>({digit,count}))
.filter(x=>x.count===max)
.map(x=>x.digit);

document.getElementById("price_"+symbol).textContent=item.price;
document.getElementById("last_"+symbol).textContent=item.last;
document.getElementById("ticks_"+symbol).textContent=total;
document.getElementById("top_"+symbol).textContent=
total?leaders.join(" / "):"--";

const display=document.getElementById("digits_"+symbol);
display.innerHTML="";

item.counts.forEach((count,digit)=>{
const percent=total?count/total*100:0;
display.innerHTML+=`
<div class="digit">
<b>${digit}</b><br>
${count}<br>
${percent.toFixed(0)}%
<div class="bar" style="width:${percent}%"></div>
</div>`;
});
}

setup();
connect();
</script>
</body>
</html>
